[package]
name = "osc3-mcp-rust"
version = "0.1.17"
edition = "2024"
license = "MIT"
description = "A cool synthesizer plugin built with Rust"
readme = "README.md"

[workspace]
members = ["xtask"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs", "standalone"] }
vizia_plug = { git = "https://github.com/vizia/vizia-plug.git", branch = "main" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
reqwest = { version = "0.13.0-rc.1", default-features = false, features = ["json", "native-tls"] }
dirs = "5"

# --- Audio Copy tab ---
# Decoding uploaded clips (wav/mp3/flac/ogg/aac), FFT for separation + analysis,
# native file dialog, lock-free buffer hand-off to the audio thread, and base64
# for the OpenRouter inline-audio request.
# Keep symphonia's default features (wav/flac/ogg/vorbis/pcm/...) and add the
# non-default codecs (mp3, aac/alac, mp4 container) for broad clip support.
symphonia = { version = "0.5", features = ["mp3", "aac", "alac", "isomp4", "aiff"] }
rustfft = "6"
rfd = "0.15"
arc-swap = "1"
base64 = "0.22"

[lib]
crate-type = ["cdylib", "lib"]

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[target.'cfg(windows)'.wants]
windows_subsystem = "windows"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
